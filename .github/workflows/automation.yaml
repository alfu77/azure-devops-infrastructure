name: CI/CD to AKS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build Docker image
      run: |
        IMAGE=${{ secrets.AZURE_CONTAINER_REGISTRY }}/nimbus-site:${{ github.sha }}
        echo "IMAGE=$IMAGE" >> $GITHUB_ENV
        docker build -t $IMAGE ./nimbus-site

    - name: Push image to ACR
      run: docker push ${{ env.IMAGE }}

    - name: Get AKS credentials
      run: az aks get-credentials -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n ${{ secrets.AZURE_AKS_CLUSTER }} --overwrite-existing

    - name: Deploy to AKS
      run: |
        kubectl set image deployment/nimbus-site web=${{ env.IMAGE }}
        kubectl rollout status deployment/nimbus-site