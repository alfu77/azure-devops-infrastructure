name: CI/CD to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upgrade Azure CLI
        shell: bash
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az version

      - name: Resolve ACR details
        shell: bash
        run: |
          ACR_NAME=$(az acr list -g "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          ACR_LOGIN_SERVER=$(az acr list -g "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "[0].loginServer" -o tsv)

          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "IMAGE=$ACR_LOGIN_SERVER/nimbus-site:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to Azure Container Registry
        shell: bash
        run: az acr login --name "${ACR_NAME}"

      - name: Build Docker image
        shell: bash
        run: docker build -t "${IMAGE}" ./nimbus-site

      - name: Push image to ACR
        shell: bash
        run: docker push "${IMAGE}"

      - name: Get AKS credentials
        shell: bash
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_AKS_CLUSTER }}" \
            --overwrite-existing

      - name: Deploy to AKS
        shell: bash
        run: |
          kubectl set image deployment/nimbus-site web="${IMAGE}"
          kubectl rollout status deployment/nimbus-site --timeout=180s
