name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      ARM_USE_CLI: "true"
      ARM_USE_AZUREAD: "true"
      TF_VAR_github_actions_principal_object_id: "8dc5278a-9016-4d62-91cd-119c948ded40"
      TF_VAR_terraform_principal_object_id: "ed81dc60-b8a8-4408-a0e0-07444cbc856b"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure with the Terraform identity
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_TERRAFORM_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Show Terraform plan
        run: terraform -chdir=terraform show -no-color tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform apply -input=false tfplan
